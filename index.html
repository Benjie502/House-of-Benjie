<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>House of Benjie</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Georgia, serif;
    background:#f7f4ee;
    color:#2d2d2d;
}

.hero{
    height:100vh;
    background-image:url("images/front-gate2.png");
    background-size:cover;
    background-position:center;
    position:relative;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
}

.welcome-box{
    text-align:center;
    max-width:1500px;
    padding:45px 60px;
    background:rgba(13, 13, 13, 0.42);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:18px;
    box-shadow:0 18px 45px rgba(0, 0, 0, 0.174);
    color:white;
    text-shadow:0 2px 6px rgba(0,0,0,0.45);
}

.subtitle{
    color:#f0c46a;
}

.message{
    color:#fffaf0;
}

h1{
    font-size:150px;
    margin-bottom:20px;
    font-weight:normal;
}

.subtitle{
    font-size:50px;
    margin-bottom:25px;
}

.message{
    font-size:clamp(20px, 2vw, 30px);
    line-height:1.5;
}

.scroll{
    position:absolute;
    bottom:30px;
    width:100%;
    text-align:center;
    font-size:18px;
    letter-spacing:3px;
}

</style>

</head>

<body>

<section class="hero">

<div class="overlay">

<div class="welcome-box">

<h1>House of Benjie</h1>

<div class="subtitle">
7973
</div>

<div class="message">

Welcome, friend.<br><br>

Stories are shared around the dining table.<br>
Lessons are learned in the workshop.<br>
Books wait quietly in the library.<br>
Coffee is always ready.<br><br>

<a href="house-map.html" style="color:inherit; text-decoration:none;
 cursor:pointer;">Ring the bell and come inside.</a>

</div>

</div>

</div>

<div class="scroll">
SCROLL TO ENTER
</div>

</section>



</body>
</html>
